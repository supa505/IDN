function dayKey(d){

function monday(d=new Date()){
 const date=new Date(d);
 const day=date.getDay();
 const diff=date.getDate()-(day===0?6:day-1);
 const mon=new Date(date.setDate(diff));
 mon.setHours(0,0,0,0);
 return mon;
}

function weekDays(baseDate=new Date()){
 const start=monday(baseDate);
 const days=[];
 for(let i=0;i<7;i++){
  const current=new Date(start);
  current.setDate(start.getDate()+i);
  days.push(current);
 }
 return days;
}

function relativeDate(deadline,now=new Date()){
 if(!deadline)return 'No deadline';
 const due=new Date(deadline);
 if(isNaN(due.getTime()))return 'Invalid date';
 const nowDate=new Date(now);
 const dueDayKey=dayKey(due);
 const nowDayKey=dayKey(nowDate);
 
 const diffMs=due.getTime()-nowDate.getTime();
 const diffDays=Math.round((new Date(dueDayKey)-new Date(nowDayKey))/(1000*60*60*24));
 
 const timeStr=due.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 
 if(diffDays<0){
  const overdueDays=Math.abs(diffDays);
  return `${overdueDays} day${overdueDays>1?'s':''} overdue`;
 }
 if(diffDays===0)return `Today · ${timeStr}`;
 if(diffDays===1)return `Tomorrow · ${timeStr}`;
 if(diffDays>1&&diffDays<=6){
  const weekday=due.toLocaleDateString([],{weekday:'long'});
  return `${weekday} · ${timeStr}`;
 }

}

function isOverdue(task,now=new Date()){
 if(!task.deadline||task.status==='Completed')return false;
 const due=new Date(task.deadline);
 return !isNaN(due.getTime())&&due.getTime()<now.getTime();
}

function weekStats(tasks,weeklyTarget=10,now=new Date()){
 const start=monday(now);
 const end=new Date(start);
 end.setDate(start.getDate()+7);
 
 const completedThisWeek=tasks.filter(t=>{
  if(t.status!=='Completed'||!t.completedAt)return false;
  const cDate=new Date(t.completedAt);
  return cDate>=start&&cDate<end;
 }).length;
 
 const activeTasks=tasks.filter(t=>t.status!=='Completed');
 const dueThisWeek=tasks.filter(t=>{
  if(!t.deadline)return false;
  const d=new Date(t.deadline);
  return d>=start&&d<end;
 });
 
 const overdueTasks=tasks.filter(t=>isOverdue(t,now));
 const percent=weeklyTarget>0?Math.min(100,Math.round((completedThisWeek/weeklyTarget)*100)):0;
 const remaining=Math.max(0,weeklyTarget-completedThisWeek);
 
 return {
  completed:completedThisWeek,
  target:weeklyTarget,
  percent,
  remaining,
  activeCount:activeTasks.length,
  overdueCount:overdueTasks.length,
  dueThisWeekCount:dueThisWeek.length
 };
}

function search(state,query){

 });

   if(type==='tasks'||type==='projects'){

   }
   if(type==='tasks'){
    if(data.status===undefined)data.status='Not Started';
    data.completedAt=data.status==='Completed'
     ?(previous?.status==='Completed'?previous.completedAt:(item.completedAt||now)):null;
   }
   if(type==='projects')data.updatedAt=now;
   if(index<0)list.push(data);else list[index]=data;
   commit(next);
   return structuredClone(state[type].find(record=>record.id===recordId));
  },
  remove(type,id){
   if(!TYPES.includes(type))throw new Error('Unknown collection: '+type);
   const next=structuredClone(state);
   next[type]=(next[type]||[]).filter(x=>x.id!==id);
   if(type==='subjects'){
    next.tasks=(next.tasks||[]).map(t=>t.subjectId===id?{...t,subjectId:''}:t);
    next.projects=(next.projects||[]).map(p=>p.subjectId===id?{...p,subjectId:''}:p);
   }
   return commit(next);
  },
  settings(patch){
   if(!object(patch))throw new Error('Settings patch must be an object.');
   const next=structuredClone(state);
   next.settings={...next.settings,...patch};
   return commit(next);
  },
  replace(next){return commit(next,{backup:true});},
  reset(useDemo=false){
   const next=useDemo===true?makeDemo():empty();
   next.settings=structuredClone(state.settings);
   return commit(next,{backup:true});
  }
 };
}

return {
 KEY,
 empty,
 id,
 safeURL,
 normalize,
 dayKey,
 monday,
 weekDays,
 relativeDate,
 isOverdue,
 weekStats,
 search,
 makeDemo,
 createStore
};
});

// 4. CALENDAR VIEW
function renderCalendar(state,subjectsMap,now){
 const visibleMonth=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1);
 const year=visibleMonth.getFullYear();
 const month=visibleMonth.getMonth();
 const monthName=visibleMonth.toLocaleDateString([],{month:'long',year:'numeric'});
 
 const firstDayOfMonth=new Date(year,month,1);
 const lastDayOfMonth=new Date(year,month+1,0);
 
 const startDay=firstDayOfMonth.getDay(); // 0 is Sun
 const offset=startDay===0?6:startDay-1; // Mon = 0
 
 const days=[];
 // Previous month padding
 const prevMonthLastDay=new Date(year,month,0).getDate();
 for(let i=offset-1;i>=0;i--){
  days.push({date:new Date(year,month-1,prevMonthLastDay-i),outside:true});
 }
 // Current month days
 for(let d=1;d<=lastDayOfMonth.getDate();d++){
  days.push({date:new Date(year,month,d),outside:false});
 }
 // Next month padding to fill complete grid of 35 or 42
 while(days.length%7!==0){
  const nextDate=new Date(year,month+1,days.length-lastDayOfMonth.getDate()-offset+1);
  days.push({date:nextDate,outside:true});
 }

 const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

 const daysHtml=days.map(({date,outside})=>{
  const dKey=TSCore.dayKey(date);
  const isToday=dKey===TSCore.dayKey(now);
  
  const tasksForDay=state.tasks.filter(t=>{
   if(!t.deadline)return false;
   return TSCore.dayKey(t.deadline)===dKey;
  });

  return `
   <div class="calendar-day ${outside?'outside':''} ${isToday?'today':''}">
    <button class="calendar-date" onclick="TSApp.openTaskModal({deadline:'${dKey}T12:00'})" title="Add task on ${dKey}">
     ${date.getDate()}
    </button>
    <div class="calendar-day-events">
     ${tasksForDay.slice(0,2).map(t=>{
      const isDone=t.status==='Completed';
      const sub=t.subjectId?subjectsMap.get(t.subjectId):null;
      return `
       <button class="calendar-event ${isDone?'done':''} ${TSCore.isOverdue(t)?'overdue':''}" title="${html(t.title)} · ${html(t.status)}" onclick="TSApp.openTaskDetail(${arg(t.id)})">
        ${escapeHtml(t.title)}
       </button>
      `;
     }).join('')}${tasksForDay.length>2?action('+'+(tasksForDay.length-2)+' more',`TSApp.openDay(${arg(dKey)})`,'calendar-more'):''}
    </div>
   </div>
  `;
 }).join('');

 return `

   <div>

   <button class="button primary" onclick="TSApp.openTaskModal()">

function openTaskModal(prefillOrId=null){

 // Format deadline for datetime-local input
 let deadlineVal='';
 if(data.deadline){

   const d=new Date(data.deadline);

 layer.innerHTML=`

// Operations & mutations
function saveTaskForm(form,id){
 const fd=new FormData(form);
 const title=fd.get('title')?.trim();
 if(!title){
  toast('Task title is required');
  return;
 }

 let deadline=fd.get('deadline');
 if(deadline){
  deadline=new Date(deadline).toISOString();
 }else{
  deadline='';
 }

 const item={
  title,
  description:fd.get('description')?.trim()||'',
  subjectId:fd.get('subjectId')||'',
  deadline,
  priority:fd.get('priority')||'Medium',
  status:fd.get('status')||'Not Started',
  projectUrl:fd.get('projectUrl')?.trim()||'',
  notes:fd.get('notes')?.trim()||''
 };

 if(id)item.id=id;

 if(item.projectUrl&&!TSCore.safeURL(item.projectUrl)){toast('Use an absolute http:// or https:// URL without credentials.');return;}
 store.upsert('tasks',item);
 closeLayer();
 toast(id?'Task updated':'Task created');
 render();
}

function saveGenericForm(form,type,id){
 const fd=new FormData(form);
 const plural=type==='subject'?'subjects':type==='project'?'projects':'links';
 const item={};

 if(type==='subject'){
  item.name=fd.get('name')?.trim();
  item.description=fd.get('description')?.trim()||'';
  item.color=fd.get('color')||'#2563eb';
 }else if(type==='project'){
  item.name=fd.get('name')?.trim();
  item.description=fd.get('description')?.trim()||'';
  item.subjectId=fd.get('subjectId')||'';
  item.status=fd.get('status')||'Active';
  item.url=fd.get('url')?.trim()||'';
  item.icon=fd.get('icon')?.trim()||'📁';
  item.pinned=form.querySelector('#proj-pinned')?.checked||false;
 }else if(type==='link'){
  item.title=fd.get('title')?.trim();
  item.url=fd.get('url')?.trim();
  item.category=fd.get('category')?.trim()||'Academic';
  item.icon=store.get().links.find(l=>l.id===id)?.icon||'links';
 }

 if(id)item.id=id;

 try{
  if(item.url&&!TSCore.safeURL(item.url))throw Error('Use an absolute http:// or https:// URL without credentials.');
  store.upsert(plural,item);
  closeLayer();
  toast(`${type.charAt(0).toUpperCase()+type.slice(1)} saved`);
  render();
 }catch(err){
  toast(err.message||'Failed to save');
 }
}

function updateTaskField(taskId,field,value){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 task[field]=value;
 store.upsert('tasks',task);
 toast(`Updated ${field}`);
 render();
 openTaskDetail(taskId);
}

function toggleTaskComplete(taskId,refreshDrawer=false){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 const isCompleted=task.status==='Completed';
 task.status=isCompleted?'In Progress':'Completed';
 store.upsert('tasks',task);
 toast(isCompleted?'Task reopened':'Task completed! 🎉');
 if(refreshDrawer){
  openTaskDetail(taskId);
 }
 render();
}

function duplicateTask(taskId){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 const clone={...task,id:null,title:`${task.title} (Copy)`,status:'Not Started',createdAt:null,completedAt:null};
 store.upsert('tasks',clone);
 closeLayer();
 toast('Task duplicated');
 render();
}

function toggleProjectPin(projectId){

 const project=state.projects.find(p=>p.id===projectId);
 if(!project)return;

function moveTaskToDay(taskId,targetDayKey){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDayKey)||isNaN(new Date(targetDayKey+'T12:00')))return;
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 // Preserve original time if set, else 23:59
 let timeStr='23:59';
 if(task.deadline){
  try{
   const orig=new Date(task.deadline);
   timeStr=orig.toTimeString().slice(0,5);
  }catch(e){}
 }
 task.deadline=new Date(`${targetDayKey}T${timeStr}:00`).toISOString();
 store.upsert('tasks',task);
 toast(`Moved to ${targetDayKey}`);
 render();
}

 store.settings({name,weeklyTarget});
 toast('Settings saved');
 render();
}

 store.settings({theme});
 applyTheme(theme);

}

function renderOverview(state,subjectsMap,now){const stats=TSCore.weekStats(state.tasks,state.settings.weeklyTarget||10,now);const week=TSCore.weekDays(now).map(TSCore.dayKey);const due=state.tasks.filter(t=>t.deadline&&week.includes(TSCore.dayKey(t.deadline)));const complete=due.filter(t=>t.status==='Completed').length;const pct=due.length?Math.round(complete/due.length*100):0;const active=state.projects.filter(p=>p.status==='Active').sort((a,b)=>Number(b.pinned)-Number(a.pinned)).slice(0,3);return `${pageTitle('YOUR PERSONAL WORKSPACE',getGreeting(state.settings.name),getTodayFormatted()+' · A clear view of what comes next.',action(icon('planner')+' Plan this week',"TSApp.navigate('planner')"))}${state.demo?'<div class="demo-banner"><span>Demo workspace · Sample tasks are saved locally. Export before replacing.</span>'+action('Manage data',"TSApp.navigate('settings')",'text-button')+'</div>':''}${!state.tasks.length&&!state.projects.length?'<div class="onboard"><div><h3>Your workspace, your way.</h3><p>Start blank, or explicitly load a sample student week.</p></div>'+action('Explore demo data',"TSApp.resetToDemo()",'button')+'</div>':''}<div class="dashboard-grid"><div class="main-column">${focusPanel(state)}<section class="week-metrics"><div class="metric"><span>This week · completed</span><strong>${stats.completed}</strong></div><div class="metric"><span>Due this week · remaining</span><strong>${due.length-complete}</strong></div><div class="metric"><span>Overdue · all tasks</span><strong class="${stats.overdueCount?'danger-text':''}">${stats.overdueCount}</strong></div><div class="metric"><span>This week's deadlines done</span><strong>${pct}%</strong></div></section>${weeklyProgress(state)}<section class="projects-section"><div class="section-head"><h2>Active projects</h2>${action('All projects '+icon('chevron-right'),"TSApp.navigate('projects')",'text-button')}</div><div class="project-grid">${active.map(p=>projectCard(p,state)).join('')||emptyView('No active projects yet.','Give your lab or coursework a home.',"TSApp.openGenericModal('project')",'New project')}</div></section><section class="quick-section"><div class="section-head"><h2>Quick resources</h2>${action('Resource hub '+icon('chevron-right'),"TSApp.navigate('links')",'text-button')}</div><div class="quick-links">${resourceChips(state)}</div></section></div><aside class="right-column"><section class="deadline-section"><div class="section-head"><h2>Upcoming deadlines</h2>${action(icon('calendar'),"TSApp.navigate('calendar')",'icon-button')}</div>${deadlines(state)}</section><section class="subjects-section"><div class="section-head"><h2>Subject progress</h2>${action('View all',"TSApp.navigate('subjects')",'text-button')}</div>${state.subjects.map(s=>{const tasks=state.tasks.filter(t=>t.subjectId===s.id),done=tasks.filter(t=>t.status==='Completed').length,p=tasks.length?Math.round(done/tasks.length*100):0;return `<button class="subject-summary" onclick="TSApp.openSubject(${arg(s.id)})"><span class="subject-summary-top">${subjectTag(s)}<span>${p}%</span></span><span class="progress-track"><span class="progress-fill" style="display:block;width:${p}%"></span></span><span class="subject-summary-footer">${done} of ${tasks.length} tasks complete</span></button>`;}).join('')||'<p class="muted small">Add your subjects to see their progress.</p>'}</section><section class="recent-section"><div class="section-head"><h2>Recent activity</h2></div>${recentHistory(state)}</section></aside></div><footer class="workspace-footer"><span>Stored in this browser · Export regularly</span><button class="text-button" onclick="TSApp.navigate('landing')">TugasSupa v${VERSION} · Product</button></footer>`;}
function filteredTasks(state,mode){let tasks=[...state.tasks];const f=taskFilters,now=new Date(),today=TSCore.dayKey(now);if(mode==='completed')tasks=tasks.filter(t=>t.status==='Completed');if(searchFilter){const q=searchFilter.toLowerCase();tasks=tasks.filter(t=>[t.title,t.description,t.notes,state.subjects.find(s=>s.id===t.subjectId)?.name||''].some(v=>v.toLowerCase().includes(q)));}if(f.scope==='Today')tasks=tasks.filter(t=>TSCore.dayKey(t.deadline)===today);if(f.scope==='Upcoming')tasks=tasks.filter(t=>t.status!=='Completed'&&t.deadline&&TSCore.dayKey(t.deadline)>today);if(f.scope==='Overdue')tasks=tasks.filter(t=>TSCore.isOverdue(t,now));if(f.scope==='Completed')tasks=tasks.filter(t=>t.status==='Completed');if(f.priority)tasks=tasks.filter(t=>t.priority===f.priority);if(f.status)tasks=tasks.filter(t=>t.status===f.status);if(f.subject)tasks=tasks.filter(t=>t.subjectId===f.subject);const sort=mode==='recent'?'created':f.sort;tasks.sort((a,b)=>sort==='priority'?(rank[a.priority]-rank[b.priority]):sort==='title'?a.title.localeCompare(b.title):sort==='created'?new Date(b.createdAt||0)-new Date(a.createdAt||0):sort==='completed'?new Date(b.completedAt||0)-new Date(a.completedAt||0):new Date(a.deadline||'9999-01-01')-new Date(b.deadline||'9999-01-01'));return tasks;}
function filterOptions(values,current,all){return (all?`<option value="">${all}</option>`:'')+values.map(v=>`<option ${current===v?'selected':''} value="${html(v)}">${html(v)}</option>`).join('');}
function renderTasksView(state,subjectsMap,mode='tasks'){const tasks=filteredTasks(state,mode);return `${pageTitle('ASSIGNMENTS & COURSEWORK',mode==='completed'?'Completed tasks':mode==='recent'?'Recently created':'My tasks','Capture the work. Choose the next step.',action(icon('plus')+' New task','TSApp.openTaskModal()','button primary'))}<div class="filter-tabs" aria-label="Filter by deadline">${['All','Today','Upcoming','Overdue','Completed'].map(v=>`<button class="${taskFilters.scope===v?'active':''}" aria-pressed="${taskFilters.scope===v}" onclick="TSApp.setTaskFilter('scope','${v}')">${v}</button>`).join('')}</div><div class="toolbar task-toolbar"><input id="task-search" aria-label="Search tasks" type="search" placeholder="Search title, notes, subject…" value="${html(searchFilter)}" oninput="TSApp.setSearchFilter(this.value)"><select aria-label="Filter priority" onchange="TSApp.setTaskFilter('priority',this.value)">${filterOptions(['High','Medium','Low'],taskFilters.priority,'All priorities')}</select><select aria-label="Filter status" onchange="TSApp.setTaskFilter('status',this.value)">${filterOptions(['Not Started','In Progress','Completed'],taskFilters.status,'All statuses')}</select><select aria-label="Filter subject" onchange="TSApp.setTaskFilter('subject',this.value)"><option value="">All subjects</option>${state.subjects.map(s=>`<option value="${html(s.id)}" ${taskFilters.subject===s.id?'selected':''}>${html(s.name)}</option>`).join('')}</select><select aria-label="Sort tasks" onchange="TSApp.setTaskFilter('sort',this.value)">${[['deadline','Deadline'],['priority','Priority'],['created','Newest'],['completed','Recently completed'],['title','Title']].map(([v,l])=>`<option value="${v}" ${taskFilters.sort===v?'selected':''}>Sort: ${l}</option>`).join('')}</select></div><p class="result-count" aria-live="polite" id="task-result-count">${tasks.length} tasks</p><div class="panel task-list" id="task-results">${tasks.map(t=>taskRow(t,state)).join('')||emptyView('No matching tasks.','Change your filters or add an assignment.',"TSApp.resetFilters()",'Clear filters')}</div>`;}
function setSearchFilter(val){searchFilter=val;const s=store.get(),items=filteredTasks(s,currentRoute);document.getElementById('task-results').innerHTML=items.map(t=>taskRow(t,s)).join('')||emptyView('No matching tasks.','Try another keyword.');document.getElementById('task-result-count').textContent=items.length+' tasks';}
function setTaskFilter(k,v){taskFilters[k]=v;render();}
function filterByStatus(v){setTaskFilter('status',v);}
function resetFilters(){searchFilter='';taskFilters={scope:'All',priority:'',status:'',subject:'',sort:'deadline'};render();}
function renderProjects(state){return `${pageTitle('COURSEWORK, WITH CONTEXT','Projects','A home for labs, repositories, and longer-term assignments.',action(icon('plus')+' New project',"TSApp.openGenericModal('project')",'button primary'))}<div class="project-grid full-projects">${[...state.projects].sort((a,b)=>Number(b.pinned)-Number(a.pinned)||new Date(b.updatedAt||0)-new Date(a.updatedAt||0)).map(p=>projectCard(p,state)).join('')||emptyView('Give your next project a home.','Connect a subject, description, and project URL.',"TSApp.openGenericModal('project')",'New project')}</div>`;}
function renderLinks(state){const list=[...state.links].filter(l=>resourceCategory==='All'||l.category===resourceCategory).sort((a,b)=>Number(b.pinned)-Number(a.pinned));const cats=[...new Set([...categories,...state.links.map(l=>l.category)])];return `${pageTitle('REFERENCE, WITHOUT THE TAB HUNT','Resource hub','Your portals, references, and useful links. Right where you need them.',action(icon('plus')+' Add resource',"TSApp.openGenericModal('link')",'button primary'))}<div class="filter-tabs">${['All',...cats].map(c=>`<button class="${resourceCategory===c?'active':''}" onclick="TSApp.setResourceCategory(${arg(c)})">${html(c)}</button>`).join('')}</div><div class="link-grid">${list.map(l=>`<article class="panel resource-card"><div class="section-head">${subjectTag({name:l.category,color:'#2563eb'})}<div class="inline-actions"><button class="icon-button ${l.pinned?'badge-pin':''}" aria-label="${l.pinned?'Unpin':'Pin'} ${html(l.title)}" aria-pressed="${!!l.pinned}" onclick="TSApp.toggleLinkPin(${arg(l.id)})">${icon('pin')}</button><button class="icon-button" aria-label="Edit ${html(l.title)}" onclick="TSApp.openGenericModal('link',${arg(l.id)})">${icon('edit')}</button><button class="icon-button" aria-label="Delete ${html(l.title)}" onclick="TSApp.deleteLink(${arg(l.id)})">${icon('trash')}</button></div></div><h3>${html(l.title)}</h3><p class="resource-url">${html(l.url)}</p>${TSCore.safeURL(l.url)?`<a class="text-button" href="${url(l.url)}" target="_blank" rel="noopener noreferrer">Open resource ${icon('external')}</a>`:action('Fix unsafe or missing URL',`TSApp.openGenericModal('link',${arg(l.id)})`,'text-button')}</article>`).join('')||emptyView('Keep useful resources close.','Add a portal, documentation page, or study reference.',"TSApp.openGenericModal('link')",'Add resource')}</div>`;}
function setResourceCategory(c){resourceCategory=c;render();}
function toggleLinkPin(id){const l=store.get().links.find(x=>x.id===id);if(l){store.upsert('links',{...l,pinned:!l.pinned});render();toast(l.pinned?'Resource unpinned':'Resource pinned');}}
function openSubject(id){const s=store.get(),sub=s.subjects.find(x=>x.id===id);if(!sub)return;const tasks=s.tasks.filter(t=>t.subjectId===id),projects=s.projects.filter(p=>p.subjectId===id);document.getElementById('layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="subject-detail-title" onclick="if(event.target===this)TSApp.closeLayer()"><section class="dialog subject-detail"><header class="dialog-head"><h2 id="subject-detail-title">${html(sub.name)}</h2><button class="icon-button" aria-label="Close subject" onclick="TSApp.closeLayer()">${icon('close')}</button></header><div class="dialog-body"><p class="muted">${html(sub.description)}</p><h3 class="preview-section-title">Tasks · ${tasks.length}</h3>${tasks.map(t=>taskRow(t,s)).join('')||'<p class="muted small">No related tasks.</p>'}<h3 class="preview-section-title">Projects · ${projects.length}</h3><div class="project-grid">${projects.map(p=>projectCard(p,s)).join('')||'<p class="muted small">No related projects.</p>'}</div></div></section></div>`;}
function changeMonth(step){calendarOffset=step===0?0:calendarOffset+step;render();}
function changeWeek(step){plannerOffset=step===0?0:plannerOffset+step;render();}
function openDay(key){const s=store.get(),tasks=s.tasks.filter(t=>TSCore.dayKey(t.deadline)===key);document.getElementById('layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Tasks for ${html(key)}" onclick="if(event.target===this)TSApp.closeLayer()"><section class="dialog"><header class="dialog-head"><h2>${shortDate(key+'T12:00')}</h2>${action(icon('close'),'TSApp.closeLayer()','icon-button')}</header><div class="dialog-body">${tasks.map(t=>taskRow(t,s)).join('')||emptyView('No deadlines.','Make space for the next assignment.')}<div class="form-actions">${action('Add task',`TSApp.openTaskModal({deadline:${arg(key+'T12:00')}})`,'button primary')}</div></div></section></div>`;}
function openMobileMenu(){document.getElementById('layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="more-title" onclick="if(event.target===this)TSApp.closeLayer()"><section class="dialog"><header class="dialog-head"><h2 id="more-title">Your workspace</h2>${action(icon('close'),'TSApp.closeLayer()','icon-button')}</header><nav class="dialog-body mobile-menu-grid">${[['overview','Overview'],['tasks','Tasks'],['planner','Weekly planner'],['calendar','Calendar'],['projects','Projects'],['subjects','Subjects'],['links','Resource hub'],['recent','Recent'],['completed','Completed'],['settings','Settings'],['landing','About TugasSupa']].map(([r,l])=>action(icon(r)+' '+l,`TSApp.navigate('${r}')`)).join('')}</nav></section></div>`;}
function commandItems(query=''){const quick=[['New Task','plus',()=>openTaskModal()],['New Project','projects',()=>openGenericModal('project')],['New Subject','subjects',()=>openGenericModal('subject')],['Add Resource','links',()=>openGenericModal('link')],['Open Dashboard','overview',()=>navigate('overview')],['Open Calendar','calendar',()=>navigate('calendar')],['Open Planner','planner',()=>navigate('planner')],['Open Settings','settings',()=>navigate('settings')],['About TugasSupa','overview',()=>navigate('landing')]].filter(x=>!query||x[0].toLowerCase().includes(query.toLowerCase())).map(([title,ic,run])=>({title,ic,subtitle:'Quick action',run}));return [...quick,...(query?TSCore.search(store.get(),query).map(r=>({title:r.title,ic:r.type==='task'?'tasks':r.type==='project'?'projects':r.type==='subject'?'subjects':'links',subtitle:r.subtitle,run:()=>r.type==='task'?openTaskDetail(r.id):r.type==='subject'?openSubject(r.id):r.type==='project'?openGenericModal('project',r.id):openGenericModal('link',r.id)})):[])].slice(0,60);}
let activeCommands=[];
function openCommandPalette(){commandPaletteOpen=true;document.getElementById('layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Search and commands" onclick="if(event.target===this)TSApp.closeLayer()"><section class="dialog command-dialog"><div class="command-input-wrap">${icon('search')}<input id="command-input" class="command-input" role="combobox" aria-label="Search workspace or commands" aria-expanded="true" aria-autocomplete="list" aria-controls="command-results" placeholder="Search your workspace…" oninput="TSApp.handleCommandInput(this.value)"><button class="key" onclick="TSApp.closeLayer()" aria-label="Close command palette">Esc</button></div><div id="command-results" class="command-results" role="listbox" aria-label="Results"></div><footer class="command-footer"><span>↑ ↓ Navigate</span><span>↵ Open</span><span>Tasks · Projects · Subjects · Resources</span></footer></section></div>`;handleCommandInput('');document.getElementById('command-input').focus();}
function handleCommandInput(q){activeCommands=commandItems(q.trim());commandIndex=0;document.getElementById('command-results').innerHTML=activeCommands.map((r,i)=>`<button class="command-item" id="cmd-${i}" role="option" aria-selected="${i===0}" tabindex="-1" onclick="TSApp.runCommand(${i})">${icon(r.ic)}<span>${html(r.title)}</span><small>${html(r.subtitle)}</small></button>`).join('')||emptyView('No results.','Try a task title, subject, resource, or command.');selectCommand(0);}
function selectCommand(i){commandIndex=activeCommands.length?(i+activeCommands.length)%activeCommands.length:0;document.querySelectorAll('.command-item').forEach((el,n)=>{el.classList.toggle('selected',n===commandIndex);el.setAttribute('aria-selected',String(n===commandIndex));});const input=document.getElementById('command-input');if(input){if(activeCommands.length)input.setAttribute('aria-activedescendant','cmd-'+commandIndex);else input.removeAttribute('aria-activedescendant');}document.getElementById('cmd-'+commandIndex)?.scrollIntoView({block:'nearest'});}
function runCommand(i){const r=activeCommands[i];if(r){closeLayer();r.run();}}
function confirmDialog(title,message,actionName='Confirm',danger=false){return new Promise(resolve=>{const layer=document.getElementById('confirm-layer');layer.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cf-title"><section class="dialog" style="max-width:440px"><header class="dialog-head"><h2 id="cf-title">${html(title)}</h2></header><div class="dialog-body"><p class="muted">${html(message)}</p><div class="form-actions"><button type="button" class="button" id="cf-cancel">Cancel</button><button type="button" class="button ${danger?'danger':'primary'}" id="cf-ok">${html(actionName)}</button></div></div></section></div>`;const finish=value=>{layer.innerHTML='';resolve(value);};layer.querySelector('#cf-cancel').onclick=()=>finish(false);layer.querySelector('#cf-ok').onclick=()=>finish(true);layer.querySelector('.overlay').onclick=e=>{if(e.target===e.currentTarget)finish(false);};});}
function downloadJSON(data,name){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json'}),link=document.createElement('a'),href=URL.createObjectURL(blob);link.href=href;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);}
function exportData(){downloadJSON(store.get(),`TugasSupa-Workspace-${TSCore.dayKey(new Date())}.json`);toast('Workspace exported');}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('This file exceeds the 10 MB import limit.');const parsed=JSON.parse(await file.text());const data=TSCore.normalize(parsed);if(!['tasks','projects','subjects','links'].every(k=>Array.isArray(parsed[k])))throw Error('Choose a complete TugasSupa workspace backup.');const counts=['tasks','projects','subjects','links'].map(k=>data[k].length+' '+k).join(', ');const ok=await confirmDialog('Import workspace?',`This file contains ${counts}. It will replace your current workspace. A recovery backup is saved before replacement. Export first for a permanent copy.`,'Import');if(!ok)return;if(store.readError)store.recover(data);else store.replace(data);closeLayer();render();toast('Workspace imported. Previous workspace backed up.');}catch(err){toast(err instanceof SyntaxError?'Import stopped: this file is not valid JSON.':('Import stopped: '+err.message));}finally{e.target.value='';}}
async function resetToDemo(){const ok=await confirmDialog('Load sample student week?','This explicitly replaces your tasks, projects, subjects, and links with academic demo data. Your preferences stay. A recovery backup is saved first; export for a permanent copy.','Load demo');if(!ok)return;store.reset(true);closeLayer();render();toast('Sample academic workspace loaded');}
async function clearAllData(){const ok=await confirmDialog('Clear this workspace?','All tasks, projects, subjects, and resources will be removed. Your preferences stay. A recovery backup is saved first. Export a permanent copy before continuing.','Clear workspace',true);if(!ok)return;store.reset(false);closeLayer();render();toast('Workspace cleared. Preferences preserved.');}
function downloadBackup(){const backup=store.getBackupRaw?.();if(!backup)return toast('No recovery backup is available yet.');downloadJSON(backup,'TugasSupa-Recovery.json');}
function downloadOriginal(){const raw=store.raw;if(raw)downloadJSON(raw,'TugasSupa-Original-Recovery.json');else toast('No raw workspace is available to download.');}
// Accessibility: shared modal focus trap, inert background, and focus restoration.
function syncModal(){const confirm=document.querySelector('#confirm-layer .overlay'),main=document.querySelector('#layer .overlay'),top=confirm||main;const app=document.getElementById('app');if(top){if(!modalReturn)modalReturn=document.activeElement;app.inert=true;document.getElementById('layer').inert=!!confirm;document.body.style.overflow='hidden';if(!top.contains(document.activeElement)){const first=top.querySelector('#cf-cancel')||top.querySelector('[autofocus]')||top.querySelector('input:not([type=hidden])')||top.querySelector('button,select,textarea,a[href]');(first||top).focus();}}else{app.inert=false;document.getElementById('layer').inert=false;document.body.style.overflow='';if(modalReturn?.isConnected)modalReturn.focus();modalReturn=null;}}
function decorate(){document.querySelectorAll('svg').forEach(s=>s.setAttribute('aria-hidden','true'));document.querySelectorAll('button').forEach(b=>{if(!b.textContent.trim()&&!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title||'Close');});document.querySelectorAll('.nav-item').forEach(b=>{b.setAttribute('aria-label',b.textContent.trim());if(b.classList.contains('active'))b.setAttribute('aria-current','page');});document.querySelectorAll('select').forEach(s=>{if(!s.labels.length&&!s.getAttribute('aria-label'))s.setAttribute('aria-label',s.title||'Choose '+(s.getAttribute('onchange')?.includes('priority')?'priority':'status'));});document.querySelectorAll('a[target="_blank"]').forEach(a=>{a.rel='noopener noreferrer';if(!TSCore.safeURL(a.getAttribute('href')))a.removeAttribute('href');});}
new MutationObserver(()=>{decorate();syncModal();}).observe(document.getElementById('layer'),{childList:true,subtree:true});
new MutationObserver(syncModal).observe(document.getElementById('confirm-layer'),{childList:true});
window.addEventListener('keydown',e=>{const top=document.querySelector('#confirm-layer .overlay')||document.querySelector('#layer .overlay');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){if(document.querySelector('#confirm-layer .overlay'))return;e.preventDefault();commandPaletteOpen?closeLayer():openCommandPalette();return;}if(!top)return;if(e.key==='Escape'){e.preventDefault();const cancel=document.getElementById('cf-cancel');if(cancel)cancel.click();else closeLayer();return;}if(commandPaletteOpen&&document.getElementById('command-input')&&!document.getElementById('cf-cancel')){if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();selectCommand(commandIndex+(e.key==='ArrowDown'?1:-1));return;}if(e.key==='Enter'&&document.activeElement.id==='command-input'){e.preventDefault();runCommand(commandIndex);return;}}if(e.key==='Tab'){const all=[...top.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select,a[href],[tabindex="0"]')].filter(x=>x.getClientRects().length&&!x.hidden);if(!all.length){e.preventDefault();return;}const first=all[0],last=all[all.length-1];if(e.shiftKey&&(document.activeElement===first||!top.contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const route=location.hash.replace('#/','');if(location.hash.startsWith('#/')){currentRoute=validRoutes.includes(route)?route:'landing';closeLayer();render();}});
const validRoutes=['landing','overview','tasks','planner','calendar','subjects','projects','links','recent','completed','settings'];
function navigate(route){if(!validRoutes.includes(route))return;closeLayer();currentRoute=route;history.replaceState(null,'',route==='landing'?'#product':'#/'+route);render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main')?.focus({preventScroll:true});}
function closeLayer(){document.getElementById('layer').innerHTML='';commandPaletteOpen=false;}

// Initial render
document.addEventListener('DOMContentLoaded',()=>{
 render();
});

// Export App API
window.TSApp={
 toggleTheme,toggleLandingMenu,setTaskFilter,resetFilters,setResourceCategory,toggleLinkPin,openSubject,changeMonth,changeWeek,openDay,openMobileMenu,runCommand,downloadBackup,downloadOriginal,
 store,
 navigate,
 render,
 openTaskDetail,
 openTaskModal,
 openGenericModal,
 openCommandPalette,
 handleCommandInput,
 closeLayer,
 saveTaskForm,
 saveGenericForm,
 updateTaskField,
 toggleTaskComplete,
 duplicateTask,
 deleteTask,
 deleteSubject,
 deleteProject,
 deleteLink,
 toggleProjectPin,
 moveTaskToDay,
 setSearchFilter,
 filterByStatus,
 saveSettings,
 setTheme,
 exportData,
 importData,
 resetToDemo,
 clearAllData
};

for(const [key,fn] of Object.entries(window.TSApp))if(typeof fn==='function')window.TSApp[key]=function(...args){try{const result=fn(...args);if(result&&typeof result.catch==='function')return result.catch(error=>toast('Action stopped: '+error.message));return result;}catch(error){toast('Action stopped: '+error.message);}};
window.addEventListener('storage',e=>{if(e.key===TSCore.KEY){toast('Workspace changed in another tab. Reload before editing.');}});
})(window);

</script>
