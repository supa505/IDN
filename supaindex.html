function safeURL(url){
 if(!url||typeof url!=='string')return '';
 const trimmed=url.trim();
 if(!trimmed)return '';
 try{
  const base=typeof window!=='undefined'&&window.location?window.location.href:'https://example.com';
  const parsed=new URL(trimmed,base);

function normalize(data){
 if(!object(data))throw new Error('Workspace must be an object.');
 if(data.version!==undefined&&data.version!==1)throw new Error('Unsupported workspace version.');
 const next=empty(),seen=new Set();
 for(const type of TYPES){
  if(data[type]!==undefined&&!Array.isArray(data[type]))throw new Error(type+' must be an array.');
  const label=(type==='subjects'||type==='projects')?'name':'title';
  next[type]=(data[type]||[]).map(item=>{
   if(!object(item))throw new Error(type+' record must be an object.');
   for(const key of ['id',label])if(typeof item[key]!=='string'||!item[key].trim())throw new Error(type+' '+key+' is required.');
   const itemId=item.id.trim();
   if(seen.has(itemId))throw new Error('Duplicate id: '+itemId);
   seen.add(itemId);
   const defaults=type==='tasks'?TASK_DEFAULTS:type==='projects'?PROJECT_DEFAULTS:type==='subjects'?SUBJECT_DEFAULTS:LINK_DEFAULTS;
   return {...structuredClone(defaults),...structuredClone(item),id:itemId,[label]:item[label].trim()};
  });

function dayKey(d){
 const date=new Date(d);
 if(isNaN(date.getTime()))return '';
 const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),day=String(date.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}

function monday(d=new Date()){
 const date=new Date(d);
 const day=date.getDay();
 const diff=date.getDate()-(day===0?6:day-1);
 const mon=new Date(date.setDate(diff));
 mon.setHours(0,0,0,0);
 return mon;
}

function weekDays(baseDate=new Date()){
 const start=monday(baseDate);
 const days=[];
 for(let i=0;i<7;i++){
  const current=new Date(start);
  current.setDate(start.getDate()+i);
  days.push(current);
 }
 return days;
}

function relativeDate(deadline,now=new Date()){
 if(!deadline)return 'No deadline';
 const due=new Date(deadline);
 if(isNaN(due.getTime()))return 'Invalid date';
 const nowDate=new Date(now);
 const dueDayKey=dayKey(due);
 const nowDayKey=dayKey(nowDate);
 
 const diffMs=due.getTime()-nowDate.getTime();
 const diffDays=Math.round((new Date(dueDayKey)-new Date(nowDayKey))/(1000*60*60*24));
 
 const timeStr=due.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 
 if(diffDays<0){
  const overdueDays=Math.abs(diffDays);
  return `${overdueDays} day${overdueDays>1?'s':''} overdue`;
 }
 if(diffDays===0)return `Today · ${timeStr}`;
 if(diffDays===1)return `Tomorrow · ${timeStr}`;
 if(diffDays>1&&diffDays<=6){
  const weekday=due.toLocaleDateString([],{weekday:'long'});
  return `${weekday} · ${timeStr}`;
 }
 return `${due.toLocaleDateString([],{month:'short',day:'numeric'})} · ${timeStr}`;
}

function isOverdue(task,now=new Date()){
 if(!task.deadline||task.status==='Completed')return false;
 const due=new Date(task.deadline);
 return !isNaN(due.getTime())&&due.getTime()<now.getTime();
}

function weekStats(tasks,weeklyTarget=10,now=new Date()){
 const start=monday(now);
 const end=new Date(start);
 end.setDate(start.getDate()+7);
 
 const completedThisWeek=tasks.filter(t=>{
  if(t.status!=='Completed'||!t.completedAt)return false;
  const cDate=new Date(t.completedAt);
  return cDate>=start&&cDate<end;
 }).length;
 
 const activeTasks=tasks.filter(t=>t.status!=='Completed');
 const dueThisWeek=tasks.filter(t=>{
  if(!t.deadline)return false;
  const d=new Date(t.deadline);
  return d>=start&&d<end;
 });
 
 const overdueTasks=tasks.filter(t=>isOverdue(t,now));
 const percent=weeklyTarget>0?Math.min(100,Math.round((completedThisWeek/weeklyTarget)*100)):0;
 const remaining=Math.max(0,weeklyTarget-completedThisWeek);
 
 return {
  completed:completedThisWeek,
  target:weeklyTarget,
  percent,
  remaining,
  activeCount:activeTasks.length,
  overdueCount:overdueTasks.length,
  dueThisWeekCount:dueThisWeek.length
 };
}

function search(state,query){
 if(!query||!query.trim())return [];
 const q=query.toLowerCase().trim();
 const results=[];
 
 (state.tasks||[]).forEach(task=>{
  if((task.title&&task.title.toLowerCase().includes(q))||
     (task.description&&task.description.toLowerCase().includes(q))||
     (task.notes&&task.notes.toLowerCase().includes(q))){
   results.push({type:'task',id:task.id,title:task.title,subtitle:task.status+' · '+task.priority,item:task});
  }
 });
 
 (state.projects||[]).forEach(project=>{
  if((project.name&&project.name.toLowerCase().includes(q))||
     (project.description&&project.description.toLowerCase().includes(q))){
   results.push({type:'project',id:project.id,title:project.name,subtitle:'Project · '+project.status,item:project});
  }
 });
 
 (state.subjects||[]).forEach(subject=>{
  if((subject.name&&subject.name.toLowerCase().includes(q))||
     (subject.description&&subject.description.toLowerCase().includes(q))){
   results.push({type:'subject',id:subject.id,title:subject.name,subtitle:'Subject',item:subject});
  }
 });
 
 (state.links||[]).forEach(link=>{
  if((link.title&&link.title.toLowerCase().includes(q))||
     (link.category&&link.category.toLowerCase().includes(q))){
   results.push({type:'link',id:link.id,title:link.title,subtitle:'Link · '+link.category,item:link});
  }
 });
 
 return results;
}

function createStore(storage){
 let state=empty();
 const raw=storage.getItem(KEY);
 if(raw){
  try{
   state=normalize(JSON.parse(raw));
  }catch(err){
   console.warn('Invalid storage content, resetting to empty.',err);
   state=empty();
  }
 }

 function commit(next){
  const normalized=normalize(next);
  storage.setItem(KEY,JSON.stringify(normalized));
  state=normalized;
  return state;
 }

 return {
  get:()=>structuredClone(state),
  upsert(type,item){
   const next=structuredClone(state);
   const now=new Date().toISOString();
   let data={...item,id:item.id||id()};
   
   if(type==='tasks'){
    data={
     description:'',subjectId:'',deadline:'',priority:'Medium',status:'Not Started',notes:'',projectUrl:'',
     ...data,
     createdAt:item.createdAt||now,
     completedAt:item.status==='Completed'?(item.completedAt||now):null
    };
   }else if(type==='projects'){
    data={
     description:'',subjectId:'',url:'',status:'Active',pinned:false,icon:'folder',
     ...data,
     createdAt:item.createdAt||now,
     updatedAt:now
    };
   }else if(type==='subjects'){
    data={
     description:'',color:'#2563eb',
     ...data
    };
   }else if(type==='links'){
    data={
     url:'',category:'Academic',icon:'globe',pinned:false,
     ...data
    };
   }
   
   const list=next[type]||[];
   const i=list.findIndex(x=>x.id===data.id);
   if(i<0)list.push(data);
   else list[i]=data;
   next[type]=list;
   commit(next);
   return data;
  },
  remove(type,id){
   const next=structuredClone(state);
   next[type]=(next[type]||[]).filter(x=>x.id!==id);
   if(type==='subjects'){
    next.tasks=(next.tasks||[]).map(t=>t.subjectId===id?{...t,subjectId:''}:t);
    next.projects=(next.projects||[]).map(p=>p.subjectId===id?{...p,subjectId:''}:p);
   }
   return commit(next);
  },
  settings(patch){
   const next=structuredClone(state);
   next.settings={...next.settings,...patch};
   return commit(next);
  },
  replace:commit,
  reset(useDemo=true){
   const next=useDemo?makeDemo():empty();
   return commit(next);
  }
 };
}

return {
 KEY,
 empty,
 id,
 safeURL,
 normalize,
 dayKey,
 monday,
 weekDays,
 relativeDate,
 isOverdue,
 weekStats,
 search,
 makeDemo,
 createStore
};

 const todayTasks=state.tasks.filter(t=>{
  if(!t.deadline||t.status==='Completed')return false;
  return TSCore.dayKey(t.deadline)===TSCore.dayKey(now);
 });
 const inProgressTasks=state.tasks.filter(t=>t.status==='In Progress');
 
 // Find most important primary task:
 // 1. Overdue first, 2. High priority due today, 3. In Progress high priority, 4. First in progress or active
 let focusTask=state.tasks.find(t=>t.status!=='Completed'&&TSCore.isOverdue(t,now));
 if(!focusTask){
  focusTask=todayTasks.find(t=>t.priority==='High')||todayTasks[0];
 }
 if(!focusTask){

 if(!focusTask&&activeTasks.length>0){

 const weekStripHtml=daysOfWeek.map(d=>{
  const dKey=TSCore.dayKey(d);

  const dayName=d.toLocaleDateString([],{weekday:'short'});
  const dayNum=d.getDate();
  
  const tasksOnDay=state.tasks.filter(t=>{
   if(!t.deadline)return false;
   return TSCore.dayKey(t.deadline)===dKey;
  });

  const tasksMarkup=tasksOnDay.map(t=>{
   const isDone=t.status==='Completed';
   const isProg=t.status==='In Progress';
   return `
    <button class="mini-task ${isDone?'done':''}" onclick="TSApp.openTaskDetail('${t.id}')">
     <span class="pill ${isDone?'green':isProg?'blue':'muted'}" style="padding:1px 3px;font-size:8px">
      ${isDone?'✓':isProg?'◐':'○'}

 const now=new Date();

function renderCalendar(state,subjectsMap,now){
 const year=now.getFullYear();
 const month=now.getMonth();
 const monthName=now.toLocaleDateString([],{month:'long',year:'numeric'});
 
 const firstDayOfMonth=new Date(year,month,1);
 const lastDayOfMonth=new Date(year,month+1,0);
 
 const startDay=firstDayOfMonth.getDay(); // 0 is Sun
 const offset=startDay===0?6:startDay-1; // Mon = 0
 
 const days=[];
 // Previous month padding
 const prevMonthLastDay=new Date(year,month,0).getDate();
 for(let i=offset-1;i>=0;i--){
  days.push({date:new Date(year,month-1,prevMonthLastDay-i),outside:true});
 }
 // Current month days
 for(let d=1;d<=lastDayOfMonth.getDate();d++){
  days.push({date:new Date(year,month,d),outside:false});
 }
 // Next month padding to fill complete grid of 35 or 42
 while(days.length%7!==0){
  const nextDate=new Date(year,month+1,days.length-lastDayOfMonth.getDate()-offset+1);
  days.push({date:nextDate,outside:true});
 }

 const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

 const daysHtml=days.map(({date,outside})=>{
  const dKey=TSCore.dayKey(date);
  const isToday=dKey===TSCore.dayKey(now);
  
  const tasksForDay=state.tasks.filter(t=>{
   if(!t.deadline)return false;
   return TSCore.dayKey(t.deadline)===dKey;
  });

  return `
   <div class="calendar-day ${outside?'outside':''} ${isToday?'today':''}">
    <button class="calendar-date" onclick="TSApp.openTaskModal({deadline:'${dKey}T12:00'})" title="Add task on ${dKey}">
     ${date.getDate()}
    </button>
    <div class="calendar-day-events">
     ${tasksForDay.map(t=>{
      const isDone=t.status==='Completed';
      const sub=t.subjectId?subjectsMap.get(t.subjectId):null;
      return `
       <button class="calendar-event ${isDone?'done':''}" style="${sub?`border-left:2px solid ${sub.color}`:''}" onclick="TSApp.openTaskDetail('${t.id}')">
        ${escapeHtml(t.title)}
       </button>
      `;
     }).join('')}
    </div>
   </div>
  `;
 }).join('');

 return `
  <div class="page-intro">
   <div>
    <div class="eyebrow">Milestones & Exams</div>
    <h1>Academic Calendar</h1>
    <div class="subtitle">Global timeline view of upcoming deadlines, quizzes, and project checkpoints.</div>
   </div>
   <button class="button primary" onclick="TSApp.openTaskModal()">
    ${icon('plus')} <span>New task</span>
   </button>
  </div>

  <div class="panel" style="padding:20px">
   <div class="calendar-header">
    <h2>${monthName}</h2>
    <div class="inline-actions">
     <button class="button ghost" onclick="TSApp.openTaskModal()">${icon('plus')} Add Milestone</button>
    </div>
   </div>

   <div class="calendar-grid">
    ${labels.map(l=>`<div class="calendar-label">${l}</div>`).join('')}
    ${daysHtml}
   </div>
  </div>
 `;
}

function openTaskModal(prefillOrId=null){

 }

  <option value="${s.id}" ${data.subjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>
 `).join('');

 // Format deadline for datetime-local input
 let deadlineVal='';
 if(data.deadline){
  try{

function handleCommandInput(query){
 const resultsContainer=document.getElementById('command-results');
 if(!resultsContainer)return;
 
 if(!query.trim()){
  resultsContainer.innerHTML=renderDefaultCommands();
  return;
 }

 const state=store.get();
 const results=TSCore.search(state,query);

 if(results.length===0){
  resultsContainer.innerHTML=`
   <div class="empty" style="padding:20px">
    <strong>No matching results</strong>
    <p class="muted">No tasks, projects, or subjects matched "${escapeHtml(query)}"</p>
   </div>
  `;
  return;
 }

 const itemsHtml=results.map(r=>{
  let iconName='folder';
  let action=`TSApp.closeLayer();`;
  if(r.type==='task'){
   iconName='tasks';
   action+=`TSApp.openTaskDetail('${r.id}');`;
  }else if(r.type==='project'){
   iconName='projects';
   action+=`TSApp.navigate('projects');`;
  }else if(r.type==='subject'){
   iconName='subjects';
   action+=`TSApp.navigate('subjects');`;
  }else if(r.type==='link'){
   iconName='links';
   if(r.item.url)action=`window.open('${escapeHtml(r.item.url)}','_blank');`;
  }

  return `
   <button class="command-item" onclick="${action}">
    ${icon(iconName)}
    <span>${escapeHtml(r.title)}</span>
    <small>${escapeHtml(r.subtitle)}</small>
   </button>
  `;
 }).join('');

 resultsContainer.innerHTML=`
  <div class="command-group">SEARCH RESULTS (${results.length})</div>
  ${itemsHtml}
 `;
}

function closeLayer(){
 document.getElementById('layer').innerHTML='';
 commandPaletteOpen=false;
}

// Global Keyboard Shortcut listener
window.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
  e.preventDefault();
  openCommandPalette();
 }else if(e.key==='Escape'){
  closeLayer();
 }
});

// Operations & mutations
function saveTaskForm(form,id){
 const fd=new FormData(form);
 const title=fd.get('title')?.trim();
 if(!title){
  toast('Task title is required');
  return;
 }

 let deadline=fd.get('deadline');
 if(deadline){
  deadline=new Date(deadline).toISOString();
 }else{
  deadline='';
 }

 const item={
  title,
  description:fd.get('description')?.trim()||'',
  subjectId:fd.get('subjectId')||'',
  deadline,
  priority:fd.get('priority')||'Medium',
  status:fd.get('status')||'Not Started',
  projectUrl:fd.get('projectUrl')?.trim()||'',
  notes:fd.get('notes')?.trim()||''
 };

 if(id)item.id=id;

 store.upsert('tasks',item);
 closeLayer();
 toast(id?'Task updated':'Task created');
 render();
}

function saveGenericForm(form,type,id){
 const fd=new FormData(form);
 const plural=type==='subject'?'subjects':type==='project'?'projects':'links';
 const item={};

 if(type==='subject'){
  item.name=fd.get('name')?.trim();
  item.description=fd.get('description')?.trim()||'';
  item.color=fd.get('color')||'#2563eb';
 }else if(type==='project'){
  item.name=fd.get('name')?.trim();
  item.description=fd.get('description')?.trim()||'';
  item.subjectId=fd.get('subjectId')||'';
  item.status=fd.get('status')||'Active';
  item.url=fd.get('url')?.trim()||'';
  item.icon=fd.get('icon')?.trim()||'📁';
  item.pinned=form.querySelector('#proj-pinned')?.checked||false;
 }else if(type==='link'){
  item.title=fd.get('title')?.trim();
  item.url=fd.get('url')?.trim();
  item.category=fd.get('category')?.trim()||'Academic';
  item.icon='links';
 }

 if(id)item.id=id;

 try{
  store.upsert(plural,item);
  closeLayer();
  toast(`${type.charAt(0).toUpperCase()+type.slice(1)} saved`);
  render();
 }catch(err){
  toast(err.message||'Failed to save');
 }
}

function updateTaskField(taskId,field,value){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 task[field]=value;
 store.upsert('tasks',task);
 toast(`Updated ${field}`);
 openTaskDetail(taskId);
}

function toggleTaskComplete(taskId,refreshDrawer=false){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 const isCompleted=task.status==='Completed';
 task.status=isCompleted?'In Progress':'Completed';
 store.upsert('tasks',task);
 toast(isCompleted?'Task reopened':'Task completed! 🎉');
 if(refreshDrawer){
  openTaskDetail(taskId);
 }
 render();
}

function duplicateTask(taskId){
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 const clone={...task,id:null,title:`${task.title} (Copy)`,createdAt:null,completedAt:null};
 store.upsert('tasks',clone);
 closeLayer();
 toast('Task duplicated');
 render();
}

async function deleteTask(taskId){
 const confirmed=await confirmDialog('Delete Task','Are you sure you want to permanently delete this task?','Delete',true);
 if(!confirmed)return;
 store.remove('tasks',taskId);
 closeLayer();
 toast('Task deleted');
 render();
}

async function deleteSubject(subjectId){
 const confirmed=await confirmDialog('Delete Subject','Deleting this subject will remove it from all linked tasks and projects. Proceed?','Delete',true);
 if(!confirmed)return;
 store.remove('subjects',subjectId);
 toast('Subject removed');
 render();
}

async function deleteProject(projectId){
 const confirmed=await confirmDialog('Delete Project','Are you sure you want to remove this project repository?','Delete',true);
 if(!confirmed)return;
 store.remove('projects',projectId);
 toast('Project removed');
 render();
}

async function deleteLink(linkId){
 const confirmed=await confirmDialog('Delete Link','Remove this quick link?','Delete',true);
 if(!confirmed)return;
 store.remove('links',linkId);
 toast('Link removed');
 render();
}

function toggleProjectPin(projectId){
 const state=store.get();
 const project=state.projects.find(p=>p.id===projectId);
 if(!project)return;
 project.pinned=!project.pinned;
 store.upsert('projects',project);
 toast(project.pinned?'Pinned to top':'Unpinned');
 render();
}

function moveTaskToDay(taskId,targetDayKey){
 if(!targetDayKey)return;
 const state=store.get();
 const task=state.tasks.find(t=>t.id===taskId);
 if(!task)return;
 
 // Preserve original time if set, else 23:59
 let timeStr='23:59';
 if(task.deadline){
  try{
   const orig=new Date(task.deadline);
   timeStr=orig.toTimeString().slice(0,5);
  }catch(e){}
 }
 task.deadline=`${targetDayKey}T${timeStr}:00`;
 store.upsert('tasks',task);
 toast(`Moved to ${targetDayKey}`);
 render();
}

function setSearchFilter(val){
 searchFilter=val;
 render();
}

function filterByStatus(val){
 const state=store.get();
 if(!val){
  searchFilter='';
 }else{
  searchFilter=val;
 }
 render();
}

function saveSettings(form){
 const fd=new FormData(form);
 const name=fd.get('name')?.trim()||'Muhammad';
 const weeklyTarget=parseInt(fd.get('weeklyTarget'),10)||10;
 store.settings({name,weeklyTarget});
 toast('Settings saved');
 render();
}

function setTheme(theme){
 store.settings({theme});
 applyTheme(theme);
 toast(`Theme changed to ${theme}`);
 render();
}

function exportData(){
 const data=store.get();
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=`TugasSupa-Workspace-${new Date().toISOString().slice(0,10)}.json`;
 a.click();
 URL.revokeObjectURL(url);
 toast('Workspace exported');
}

function importData(e){
 const file=e.target.files?.[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=evt=>{
  try{
   const parsed=JSON.parse(evt.target.result);
   store.replace(parsed);
   toast('Workspace restored successfully! ✦');
   render();
  }catch(err){
   alert('Failed to import JSON: '+err.message);
  }
 };
 reader.readAsText(file);
}

async function resetToDemo(){
 const ok=await confirmDialog('Reset to Demo','Replace your workspace with the rich student sample dataset?','Reset',false);
 if(!ok)return;
 store.reset(true);
 toast('Workspace reset to demo data');
 render();
}

async function clearAllData(){
 const ok=await confirmDialog('Clear Workspace','Are you sure you want to delete ALL data? This action cannot be undone.','Clear All',true);
 if(!ok)return;
 store.reset(false);
 toast('Workspace completely cleared');
 render();
}

// Initial render
document.addEventListener('DOMContentLoaded',()=>{
 render();
});

// Export App API
window.TSApp={
 store,
 navigate,
 render,
 openTaskDetail,
 openTaskModal,
 openGenericModal,
 openCommandPalette,
 handleCommandInput,
 closeLayer,
 saveTaskForm,
 saveGenericForm,
 updateTaskField,
 toggleTaskComplete,
 duplicateTask,
 deleteTask,
 deleteSubject,
 deleteProject,
 deleteLink,
 toggleProjectPin,
 moveTaskToDay,
 setSearchFilter,
 filterByStatus,
 saveSettings,
 setTheme,
 exportData,
 importData,
 resetToDemo,
 clearAllData
};

})(window);
</script>
